name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.3.1rc1"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Require tag on main with matching package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then TAG="${{ github.event.inputs.tag }}"; fi
          git fetch origin main:refs/remotes/origin/main
          TARGET="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$TARGET" origin/main
          VER="$(python3 setup.py --version)"
          test "$TAG" = "v$VER"
          echo "release guard: $TAG -> $TARGET on origin/main, version $VER"
      - name: Test and build distributions
        run: |
          python3 -m pip install --upgrade pip build twine
          python3 -m unittest discover -s tests
          python3 -m ovo_acceptance bundle examples/valid-bundle.json --json
          python3 -m build
          python3 -m twine check dist/*
      - name: Install and smoke-test the wheel
        run: |
          python3 -m venv /tmp/ovo-acceptance-wheel
          /tmp/ovo-acceptance-wheel/bin/pip install --no-deps dist/*.whl
          /tmp/ovo-acceptance-wheel/bin/python -m ovo_acceptance bundle examples/valid-bundle.json --json
          /tmp/ovo-acceptance-wheel/bin/python -c "from ovo_acceptance import model; assert model.load_schema('task_result').get('$id') == 'ovo.task-result/1'"

  pypi-publish:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build
      - name: Publish ovo-acceptance to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
